<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patent Search</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --border: #e3e3e8;
      --text: #1a1a1e;
      --muted: #6b6b76;
      --accent: #2d5bd7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }
    #query {
      flex: 1 1 320px;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
    }
    select, #classification, #topk {
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
    }
    #classification { flex: 0 1 160px; }
    #topk { width: 80px; }
    button {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }

    .meta { color: var(--muted); font-size: 13px; margin: 16px 0 8px; min-height: 18px; }

    .result {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.12s;
    }
    .result:hover { border-color: var(--accent); }
    .result-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .doc { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
    .score {
      font-size: 12px;
      color: var(--accent);
      font-family: ui-monospace, monospace;
      white-space: nowrap;
    }
    .title { font-size: 15px; font-weight: 600; margin: 2px 0 6px; }
    .abstract { font-size: 13px; color: var(--muted); }
    .empty { color: var(--muted); font-size: 14px; padding: 20px 0; }

    /* modal */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 10;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .overlay.open { display: block; }
    .modal {
      background: var(--card);
      max-width: 720px;
      margin: 0 auto;
      border-radius: 12px;
      padding: 24px 28px 32px;
    }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .modal-doc { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; }
    .modal-class { font-size: 12px; color: var(--accent); font-family: ui-monospace, monospace; }
    .modal-title { font-size: 19px; font-weight: 700; margin: 4px 0 16px; }
    .close-btn {
      background: none; color: var(--muted); border: 1px solid var(--border);
      padding: 4px 10px; font-size: 18px; line-height: 1; border-radius: 6px;
    }
    .section-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--muted); margin: 20px 0 6px;
    }
    .modal-abstract { font-size: 14px; }
    .claim {
      font-size: 13px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }
    .claim-idx { color: var(--accent); font-weight: 600; font-family: ui-monospace, monospace; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Patent Search</h1>
    <p class="sub">Hybrid search over patents — keyword + semantic + claim, fused with RRF.</p>

    <div class="controls">
      <input id="query" type="text" placeholder="e.g. tire pressure monitoring" autofocus>
      <select id="mode">
        <option value="hybrid">hybrid</option>
        <option value="keyword">keyword</option>
        <option value="semantic">semantic</option>
        <option value="claim">claim</option>
      </select>
      <input id="classification" type="text" placeholder="class (e.g. B60B)">
      <input id="topk" type="number" value="10" min="1" max="50" title="top_k">
      <button id="go">Search</button>
    </div>

    <div class="meta" id="meta"></div>
    <div id="results"></div>
  </div>

  <!-- detail modal -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modal">
      <div class="modal-head">
        <div>
          <span class="modal-doc" id="m-doc"></span>
          &nbsp;·&nbsp;
          <span class="modal-class" id="m-class"></span>
        </div>
        <button class="close-btn" id="m-close" title="Close">×</button>
      </div>
      <div class="modal-title" id="m-title"></div>
      <div class="section-label">Abstract</div>
      <div class="modal-abstract" id="m-abstract"></div>
      <div class="section-label" id="m-claims-label">Claims</div>
      <div id="m-claims"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const queryEl = $("query"), modeEl = $("mode"), classEl = $("classification");
    const topkEl = $("topk"), goEl = $("go"), metaEl = $("meta"), resultsEl = $("results");
    const overlay = $("overlay");

    function escapeHtml(s) {
      return (s || "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function runSearch() {
      const query = queryEl.value.trim();
      if (!query) { queryEl.focus(); return; }
      const params = new URLSearchParams({
        query, mode: modeEl.value, top_k: topkEl.value || "10",
      });
      const cls = classEl.value.trim();
      if (cls) params.set("classification", cls);

      goEl.disabled = true;
      metaEl.textContent = "Searching…";
      resultsEl.innerHTML = "";
      try {
        const res = await fetch(`/search?${params.toString()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        render(await res.json());
      } catch (err) {
        metaEl.textContent = "";
        resultsEl.innerHTML = `<div class="empty">Error: ${escapeHtml(err.message)}</div>`;
      } finally {
        goEl.disabled = false;
      }
    }

    function render(data) {
      const results = data.results || [];
      const elapsed = typeof data.elapsed === "number" ? data.elapsed.toFixed(3) : "?";
      metaEl.textContent = `${results.length} results in ${elapsed}s`;
      if (results.length === 0) {
        resultsEl.innerHTML = `<div class="empty">No matches. Try a different query or mode.</div>`;
        return;
      }
      // each result: [pid, doc_number, title, abstract, score]
      resultsEl.innerHTML = results.map(r => {
        const doc = escapeHtml(r[1]);
        const title = escapeHtml(r[2]);
        const full = r[3] || "";
        const abstract = escapeHtml(full.slice(0, 280)) + (full.length > 280 ? "…" : "");
        const score = typeof r[4] === "number" ? r[4].toFixed(4) : "";
        return `
          <div class="result" data-doc="${doc}">
            <div class="result-top">
              <span class="doc">${doc}</span>
              <span class="score">${score}</span>
            </div>
            <div class="title">${title}</div>
            <div class="abstract">${abstract}</div>
          </div>`;
      }).join("");

      // wire up click -> open detail
      document.querySelectorAll(".result").forEach(el => {
        el.addEventListener("click", () => openDetail(el.dataset.doc));
      });
    }

    async function openDetail(doc) {
      $("m-doc").textContent = doc;
      $("m-class").textContent = "";
      $("m-title").textContent = "Loading…";
      $("m-abstract").textContent = "";
      $("m-claims").innerHTML = "";
      overlay.classList.add("open");
      try {
        const res = await fetch(`/patent/${encodeURIComponent(doc)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const p = await res.json();
        if (p.error) throw new Error(p.error);
        $("m-title").textContent = p.title || "";
        $("m-class").textContent = p.classification || "";
        $("m-abstract").textContent = p.abstract || "(no abstract)";
        const claims = p.claims || [];
        $("m-claims-label").style.display = claims.length ? "block" : "none";
        $("m-claims").innerHTML = claims.map((c, i) =>
          `<div class="claim"><span class="claim-idx">${i + 1}.</span>${escapeHtml(c)}</div>`
        ).join("");
      } catch (err) {
        $("m-title").textContent = "Error";
        $("m-abstract").textContent = err.message;
      }
    }

    function closeDetail() { overlay.classList.remove("open"); }

    $("m-close").addEventListener("click", closeDetail);
    overlay.addEventListener("click", e => { if (e.target === overlay) closeDetail(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

    goEl.addEventListener("click", runSearch);
    queryEl.addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });
  </script>
</body>
</html>
